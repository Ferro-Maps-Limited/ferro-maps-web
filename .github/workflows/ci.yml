name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Lint
        run: |
          pnpm --filter marketing lint
          pnpm --filter admin lint

      - name: Build marketing
        run: pnpm --filter marketing build

      - name: Build admin
        run: pnpm --filter admin build

      - name: Test private parking import
        working-directory: scripts/import-private-parking
        run: npm ci && npm test

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Lint functions
        working-directory: functions
        run: npm run lint

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Guard mobile-owned function names
        working-directory: functions
        run: npm run test:guard

      - name: Surge sheet tests
        working-directory: functions
        run: npm run test:surge

      - name: Parking sheet and road charge tests
        working-directory: functions
        run: npm run test:feeds

      - name: Payment push tests
        working-directory: functions
        run: npm run test:payment-push

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Surge sheet emulator test
        working-directory: functions
        run: npx firebase emulators:exec --config ../firebase.emulator.json --project demo-ferromaps-stadium-surge --only firestore "node --import tsx --test --test-concurrency=1 --test-reporter spec test/surgeSheet.emulator.test.ts test/categoryForecast.emulator.test.ts test/forecastHistory.emulator.test.ts test/missingPlaces.emulator.test.ts test/hotspotForecasts.emulator.test.ts test/plannerSummaries.emulator.test.ts test/hotspotUnlock.emulator.test.ts"

      - name: Payment push emulator test
        working-directory: functions
        run: npx firebase emulators:exec --only firestore --project demo-ferromaps-payment-push "node --import tsx --test --test-concurrency=1 --test-reporter spec test/paymentPush.emulator.test.ts"

      - name: Stripe webhook emulator test
        working-directory: functions
        run: npm run test:stripe-webhook:emulator
